<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>MANTEX 5.0 (réplica)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f0; --panel:#ffffff; --panel-2:#f4f6f5; --line:#d7dcda;
  --fg:#1c2530; --muted:#5c6670; --accent:#2b5fae; --accent-ink:#17407f; --accent-soft:#e3ebfa;
  --accent2:#c2703d; --accent2-soft:#f6e6da;
  --ok:#1f8a53; --ok-soft:#e1f3ea; --warn:#a9770f; --warn-soft:#faefd7; --bad:#b23c3c; --bad-soft:#fae3e3;
  --topbar:#1a2740; --topbar-fg:#eef2fb;
  --shadow:0 1px 2px rgba(20,30,45,.06),0 8px 20px -14px rgba(20,30,45,.2);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1319; --panel:#171e27; --panel-2:#121820; --line:#2a333e;
    --fg:#e7ebf1; --muted:#98a2b1; --accent:#7badfb; --accent-ink:#bcd6ff; --accent-soft:#1d2c47;
    --accent2:#e3a06f; --accent2-soft:#3a2a1d;
    --ok:#5fcf93; --ok-soft:#163327; --warn:#e3b955; --warn-soft:#3a2f14; --bad:#e98a8a; --bad-soft:#3a1d1d;
    --topbar:#0c121c; --topbar-fg:#e7ebf1;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 20px -14px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1319; --panel:#171e27; --panel-2:#121820; --line:#2a333e;
  --fg:#e7ebf1; --muted:#98a2b1; --accent:#7badfb; --accent-ink:#bcd6ff; --accent-soft:#1d2c47;
  --accent2:#e3a06f; --accent2-soft:#3a2a1d;
  --ok:#5fcf93; --ok-soft:#163327; --warn:#e3b955; --warn-soft:#3a2f14; --bad:#e98a8a; --bad-soft:#3a1d1d;
  --topbar:#0c121c; --topbar-fg:#e7ebf1;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 20px -14px rgba(0,0,0,.6);
  color-scheme: dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px;line-height:1.5}
code,.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
button,input,select,textarea{font-family:inherit;font-size:14px;color:var(--fg)}
button{cursor:pointer}
.gutter{padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
#app{min-height:100vh;display:flex;flex-direction:column}

/* ---- generic buttons / inputs ---- */
.btn{border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:8px 14px;border-radius:8px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],input[type=password],select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);
}
textarea{resize:vertical;min-height:70px}
label.field{display:block;margin-bottom:14px;min-width:0}
label.field .lbl{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:500}
label.field .lbl .req{color:var(--bad)}
.field-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0 14px}
fieldset.section{border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px;background:var(--panel)}
fieldset.section > legend{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--accent-ink);font-weight:600;padding:0 6px}
.chipsel{display:flex;flex-wrap:wrap;gap:6px}
.chipsel button{border:1px solid var(--line);background:var(--panel-2);padding:6px 11px;border-radius:999px;font-size:12.5px;color:var(--fg)}
.chipsel button.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.badge{display:inline-flex;align-items:center;font-family:"IBM Plex Mono";font-size:11px;padding:2px 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel-2)}
.badge.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.badge.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.badge.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.badge.acc{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}

/* ---- screens: login / company select ---- */
.center-screen{flex:1;display:flex;align-items:center;justify-content:center;padding:30px 16px}
.auth-card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px 26px;box-shadow:var(--shadow)}
.auth-card h1{font-size:20px;margin:0 0 4px}
.auth-card p.sub{color:var(--muted);font-size:13.5px;margin:0 0 20px}
.brandmark{width:40px;height:40px;border-radius:10px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-family:"IBM Plex Mono";font-weight:600;margin-bottom:14px}

.company-wrap{width:100%;max-width:560px}
.company-wrap h1{font-size:20px;margin:0 0 18px;text-align:center}
.co-card{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
.co-card:hover{border-color:var(--accent)}
.co-avatar{width:42px;height:42px;border-radius:10px;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.co-card .meta{flex:1;min-width:0}
.co-card .meta .nm{font-weight:600}
.co-card .meta .sub{font-size:12.5px;color:var(--muted)}

/* ---- topbar ---- */
.topbar{background:var(--topbar);color:var(--topbar-fg);display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-left,0px)) 10px max(16px,env(safe-area-inset-right,0px));position:sticky;top:0;z-index:20}
.topbar .back{background:transparent;border:none;color:var(--topbar-fg);font-size:18px;padding:4px 8px;border-radius:7px}
.topbar .back:hover{background:rgba(255,255,255,.1)}
.topbar .ttl{font-weight:600;font-size:15.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .acts{display:flex;gap:4px;flex-shrink:0}
.topbar .acts button{background:transparent;border:none;color:var(--topbar-fg);padding:6px 9px;border-radius:7px;font-size:13px}
.topbar .acts button:hover{background:rgba(255,255,255,.12)}
.topbar .acts button.hl{background:#ffffff22}

/* ---- home grid ---- */
.home-head{padding:16px max(16px,env(safe-area-inset-left,0px)) 4px}
.home-head .co-name{font-size:19px;font-weight:700}
.home-head .co-role{font-size:12.5px;color:var(--muted)}
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;padding:14px max(16px,env(safe-area-inset-left,0px)) 40px}
.tile{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:12px;padding:14px 12px;text-align:left;box-shadow:var(--shadow);min-height:92px;display:flex;flex-direction:column;justify-content:space-between}
.tile:hover{transform:translateY(-1px)}
.tile .ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:"IBM Plex Mono";font-weight:700;font-size:12px;background:var(--panel-2);color:var(--accent-ink)}
.tile .lbl{font-size:12.8px;font-weight:600;margin-top:8px;line-height:1.25}
.tile.plan-basico{border-left-color:#c9a227}
.tile.plan-profesional{border-left-color:#2b5fae}
.tile.plan-empresarial{border-left-color:#7b3fae}
.tile.plan-profemp{border-left-color:#9a3fae}

/* ---- module screen layout ---- */
.mod-body{flex:1;padding:16px max(16px,env(safe-area-inset-left,0px)) 60px;max-width:1080px;width:100%;margin:0 auto}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.toolbar input[type=search],.toolbar input[type=text]{flex:1;min-width:160px}
.toolbar .spacer{flex:1}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:999px;font-size:13px}
.tabs button.active{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs button .cnt{opacity:.75;margin-left:4px}

.card-list{display:flex;flex-direction:column;gap:10px}
.item-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px;box-shadow:var(--shadow);min-width:0}
.item-card .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.item-card .ttl{font-weight:600;font-size:14.5px}
.item-card .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.item-card .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.item-card .acts{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap}
.empty-state{text-align:center;color:var(--muted);padding:50px 10px;font-size:14px}
.pager{display:flex;justify-content:center;align-items:center;gap:10px;color:var(--muted);font-size:12.5px;margin-top:14px}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table.data{width:100%;border-collapse:collapse;font-size:13.3px;min-width:560px}
table.data thead th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.data tbody td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.data tbody tr:last-child td{border-bottom:none}
table.data tbody tr:hover{background:var(--panel-2)}

.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.stat-box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow);cursor:pointer}
.stat-box.active{border-color:var(--accent)}
.stat-box .n{font-family:"IBM Plex Mono";font-size:22px;font-weight:600}
.stat-box .l{font-size:11.5px;color:var(--muted)}

/* ---- modal / drawer ---- */
.overlay{position:fixed;inset:0;background:rgba(10,14,20,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0}
@media (min-width:720px){.overlay{align-items:center}}
.sheet{background:var(--panel);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;box-shadow:var(--shadow)}
@media (min-width:720px){.sheet{border-radius:14px;max-height:88vh}}
.sheet-head{position:sticky;top:0;background:var(--panel);display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet-head h2{font-size:16.5px;margin:0}
.sheet-body{padding:18px}
.sheet-foot{position:sticky;bottom:0;background:var(--panel);display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--line)}
.iconbtn{background:transparent;border:none;color:var(--muted);font-size:18px;padding:4px 8px;border-radius:7px}
.iconbtn:hover{background:var(--panel-2)}

.confirm-box{max-width:360px;text-align:center;padding:26px 22px}
.confirm-box p{color:var(--muted);font-size:13.5px}
.confirm-box .acts{display:flex;gap:8px;justify-content:center;margin-top:18px}

.sig-pad{border:1px dashed var(--line);border-radius:10px;touch-action:none;width:100%;height:110px;background:var(--panel-2)}

.toast-wrap{position:fixed;bottom:18px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:80;pointer-events:none}
.toast{background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;box-shadow:var(--shadow)}

.kanban{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kcol h4{font-size:12.5px;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.kcol .item-card{margin-bottom:8px}

.perm-group{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:var(--panel)}
.perm-group summary{padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.perm-row{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-top:1px solid var(--line);font-size:13px;gap:10px}
.switch{position:relative;width:38px;height:22px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.switch .trk{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.15s}
.switch .trk::after{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.switch input:checked + .trk{background:var(--accent)}
.switch input:checked + .trk::after{left:19px}
.role-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}

.flowbar{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
.flowbar button{font-size:11.5px}
.sign-placeholder{font-size:12px;color:var(--muted);text-align:center;padding-top:40px}

@media (max-width:520px){ .item-card .row1{flex-direction:column} }
</style>
<div id="app"></div>
<div id="overlays"></div>
<div class="toast-wrap" id="toastWrap"></div>
<script>
/* =========================================================================
   MANTEX 5.0 — réplica funcional (demo educativa, sin backend real)
   Estado en memoria + localStorage por visor. Sin librerías externas.
   ========================================================================= */
"use strict";

/* ---------------- utilidades ---------------- */
const $app = document.getElementById('app');
const $ov = document.getElementById('overlays');
const $toasts = document.getElementById('toastWrap');
function uid(p){ return (p||'id') + '_' + Math.random().toString(36).slice(2,9); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso+'T00:00:00'); if(isNaN(d)) return iso; return d.toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'}); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function nowHHMM(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  $toasts.appendChild(t); setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300); }, 2200);
}
function closeOverlay(){ $ov.innerHTML=''; }
function openOverlay(html){ $ov.innerHTML = '<div class="overlay" id="ovBg">'+html+'</div>';
  document.getElementById('ovBg').addEventListener('mousedown', e=>{ if(e.target.id==='ovBg') askCloseOverlay(); });
}
let overlayDirty = false;
function askCloseOverlay(force){
  if(overlayDirty && !force){
    openConfirm('¿Salir sin guardar?','Si sales ahora perderás la información que llevas registrada.','Salir','Seguir editando',()=>{ overlayDirty=false; closeOverlay(); });
    return;
  }
  overlayDirty=false; closeOverlay();
}
function openConfirm(title, body, okLabel, cancelLabel, onOk){
  const html = `<div class="sheet confirm-box" onmousedown="event.stopPropagation()">
    <h2 style="font-size:16px;margin:0 0 6px">${esc(title)}</h2>
    <p>${esc(body)}</p>
    <div class="acts">
      <button class="btn" id="cfCancel">${esc(cancelLabel||'Cancelar')}</button>
      <button class="btn danger" id="cfOk">${esc(okLabel||'Confirmar')}</button>
    </div>
  </div>`;
  const prevOv = $ov.innerHTML;
  $ov.insertAdjacentHTML('beforeend', `<div class="overlay" id="cfBg">${html}</div>`);
  document.getElementById('cfCancel').onclick = ()=>{ document.getElementById('cfBg').remove(); };
  document.getElementById('cfOk').onclick = ()=>{ document.getElementById('cfBg').remove(); onOk && onOk(); };
}
function fieldHTML(f, value){
  const v = value==null ? (f.default!=null?f.default:'') : value;
  const req = f.required ? '<span class="req"> *</span>' : '';
  let input='';
  if(f.type==='select'){
    input = `<select name="${f.key}" ${f.required?'required':''}>` +
      (f.placeholder?`<option value="">${esc(f.placeholder)}</option>`:'') +
      f.options.map(o=>`<option value="${esc(o)}" ${o===v?'selected':''}>${esc(o)}</option>`).join('') + `</select>`;
  } else if(f.type==='textarea'){
    input = `<textarea name="${f.key}" ${f.required?'required':''} placeholder="${esc(f.placeholder||'')}">${esc(v)}</textarea>`;
  } else if(f.type==='chips'){
    input = `<div class="chipsel" data-chipfield="${f.key}">` + f.options.map(o=>
      `<button type="button" class="${o===v?'sel':''}" data-chipval="${esc(o)}">${esc(o)}</button>`).join('') +
      `<input type="hidden" name="${f.key}" value="${esc(v)}" required=${f.required?'true':'false'}></div>`;
  } else if(f.type==='number'){
    input = `<input type="number" name="${f.key}" value="${esc(v)}" ${f.min!=null?`min="${f.min}"`:''} ${f.required?'required':''}>`;
  } else if(f.type==='date'){
    input = `<input type="date" name="${f.key}" value="${esc(v)}" ${f.required?'required':''}>`;
  } else if(f.type==='time'){
    input = `<input type="time" name="${f.key}" value="${esc(v)}" ${f.required?'required':''}>`;
  } else if(f.type==='toggle'){
    input = `<label class="switch"><input type="checkbox" name="${f.key}" ${v?'checked':''}><span class="trk"></span></label>`;
  } else if(f.type==='sign'){
    input = `<canvas class="sig-pad" data-sig="${f.key}" width="560" height="110"></canvas>
      <input type="hidden" name="${f.key}" value="${v?'1':''}">
      <div style="margin-top:6px"><button type="button" class="btn sm" data-clearsig="${f.key}">Limpiar firma</button></div>`;
  } else {
    input = `<input type="text" name="${f.key}" value="${esc(v)}" placeholder="${esc(f.placeholder||'')}" ${f.required?'required':''}>`;
  }
  return `<label class="field"><span class="lbl">${esc(f.label)}${req}</span>${input}</label>`;
}
function readForm(form, fields){
  const out = {};
  fields.forEach(f=>{
    if(f.type==='toggle'){ out[f.key] = form.querySelector(`[name="${f.key}"]`).checked; }
    else if(f.type==='number'){ const el=form.querySelector(`[name="${f.key}"]`); out[f.key] = el.value===''?null:Number(el.value); }
    else { const el=form.querySelector(`[name="${f.key}"]`); out[f.key] = el ? el.value : ''; }
  });
  return out;
}
function wireChips(container){
  container.querySelectorAll('[data-chipfield]').forEach(wrap=>{
    wrap.querySelectorAll('[data-chipval]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        wrap.querySelectorAll('button').forEach(b=>b.classList.remove('sel'));
        btn.classList.add('sel');
        wrap.querySelector('input[type=hidden]').value = btn.dataset.chipval;
        overlayDirty = true;
      });
    });
  });
}
function wireSign(container){
  container.querySelectorAll('canvas.sig-pad').forEach(cv=>{
    const ctx = cv.getContext('2d'); let drawing=false;
    const hid = container.querySelector(`input[type=hidden][name="${cv.dataset.sig}"]`);
    ctx.strokeStyle = getComputedStyle(document.body).color; ctx.lineWidth=2; ctx.lineJoin='round'; ctx.lineCap='round';
    function pos(e){ const r=cv.getBoundingClientRect(); const p = e.touches? e.touches[0]:e; return [(p.clientX-r.left)*(cv.width/r.width), (p.clientY-r.top)*(cv.height/r.height)]; }
    function start(e){ drawing=true; const [x,y]=pos(e); ctx.beginPath(); ctx.moveTo(x,y); overlayDirty=true; }
    function move(e){ if(!drawing) return; const [x,y]=pos(e); ctx.lineTo(x,y); ctx.stroke(); hid.value='1'; e.preventDefault(); }
    function end(){ drawing=false; }
    cv.addEventListener('mousedown',start); cv.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
    cv.addEventListener('touchstart',start); cv.addEventListener('touchmove',move,{passive:false}); cv.addEventListener('touchend',end);
  });
  container.querySelectorAll('[data-clearsig]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const cv = container.querySelector(`canvas[data-sig="${btn.dataset.clearsig}"]`);
      cv.getContext('2d').clearRect(0,0,cv.width,cv.height);
      container.querySelector(`input[type=hidden][name="${btn.dataset.clearsig}"]`).value='';

let DB;
function loadDB(){
  try{
    const raw = localStorage.getItem('mantexDemoDB_v1');
    if(raw){ DB = JSON.parse(raw); return; }
  }catch(e){}
  DB = seedDB();
}
function saveDB(){
  try{ localStorage.setItem('mantexDemoDB_v1', JSON.stringify(DB)); }catch(e){}
}
function resetDB(){
  try{ localStorage.removeItem('mantexDemoDB_v1'); }catch(e){}
  DB = seedDB(); session.companyId=null; session.view='companies'; render();
  toast('Datos de demostración restablecidos');
}

/* ---------------- sesión / navegación ---------------- */
let session = { userId:'u1', companyId:null, role:null, view:'login', params:{}, stack:[] };
function curCompany(){ return DB.companies.find(c=>c.id===session.companyId); }
function curRole(){ return session.role; }
function hasPerm(perm){ if(!session.companyId||!session.role) return false; const r=DB.roles[session.companyId]&&DB.roles[session.companyId][session.role]; return r? !!r[perm] : false; }
function companyColl(name){ return DB[name].filter(x=>x.companyId===session.companyId); }
function navigate(view, params){ session.stack.push({view:session.view, params:session.params}); session.view=view; session.params=Object.assign({}, params||{}); closeOverlay(); render(); }
function goBack(){ const p=session.stack.pop(); if(p){session.view=p.view; session.params=p.params;} else {session.view='home'; session.params={};} closeOverlay(); render(); }
function goHome(){ session.stack=[]; session.view='home'; session.params={}; closeOverlay(); render(); }

/* ---------------- opciones dinámicas ---------------- */
function assetOptions(onlyTipo){
  return companyColl('assets').filter(a=>!onlyTipo||a.tipo===onlyTipo).map(a=>`${a.codigo} — ${a.nombre}`);
}
function tecnicoOptions(){
  return DB.users.filter(u=>u.memberships.some(m=>m.companyId===session.companyId)).map(u=>u.nombre);
}
function routineOptions(){ return companyColl('maintenanceRoutines').map(r=>r.nombre); }
function planOptions(){ return companyColl('maintenancePlans').map(p=>p.nombre); }

/* ---------------- motor genérico de listado ---------------- */
function resolveFields(mod){
  return mod.fields.map(f=> f.optionsFn ? Object.assign({}, f, {options:f.optionsFn()}) : f );
}
function renderModuleScreen(modKey, params){
  const mod = MODULES[modKey];
  params = params || {};
  if(!params._q) params._q = '';
  if(!params._tab) params._tab = mod.statusField ? 'Todos' : (modKey==='activos' ? 'Todos' : null);

  if(mod.kanban){ renderKanbanScreen(mod, params); return; }

  let items = companyColl(mod.coll);
  if(modKey==='activos' && params.fixedTipo && params._tab==='Todos' && !params._tabTouched){ /* no-op, tab filter below handles */ }
  if(modKey==='activos'){
    if(params._tab==='Equipos') items = items.filter(a=>a.tipo==='equipo');
    else if(params._tab==='Inmuebles') items = items.filter(a=>a.tipo==='inmueble');
  } else if(mod.statusField && params._tab && params._tab!=='Todos'){
    items = items.filter(it=>it[mod.statusField]===params._tab);
  }
  if(params._q){
    const q = params._q.toLowerCase();
    items = items.filter(it=> JSON.stringify(it).toLowerCase().includes(q));
  }
  items = items.slice().reverse();

  let tabsHTML = '';
  if(modKey==='activos'){
    const all = companyColl('assets');
    const tabsDef = [['Todos',all.length],['Equipos',all.filter(a=>a.tipo==='equipo').length],['Inmuebles',all.filter(a=>a.tipo==='inmueble').length]];
    tabsHTML = `<div class="tabs">${tabsDef.map(([l,c])=>`<button class="${params._tab===l?'active':''}" data-tab="${l}">${l} <span class="cnt">${c}</span></button>`).join('')}</div>`;
  } else if(mod.statusField){
    const all = companyColl(mod.coll);
    const tabsDef = [['Todos',all.length]].concat(mod.statuses.map(s=>[s, all.filter(x=>x[mod.statusField]===s).length]));
    tabsHTML = `<div class="tabs">${tabsDef.map(([l,c])=>`<button class="${params._tab===l?'active':''}" data-tab="${l}">${l} <span class="cnt">${c}</span></button>`).join('')}</div>`;
  }

  const listHTML = items.length ? `<div class="card-list">${items.map(it=>{
    const tags = mod.tags ? mod.tags(it).join('') : '';
    const rowA = mod.rowActions ? mod.rowActions(it).join('') : '';
    const extraA = mod.extraRowActions ? mod.extraRowActions(it) : '';
    return `<div class="item-card" data-itemid="${it.id}">
      <div class="row1">
        <div><div class="ttl">${esc(mod.cardTitle(it))}</div><div class="sub">${esc(mod.cardSub(it))}</div></div>
      </div>
      ${tags?`<div class="tags">${tags}</div>`:''}
      <div class="acts">
        ${rowA}
        ${extraA}
        ${mod.noEdit?'':`<button class="btn sm" data-edit="${it.id}">Editar</button>`}
        ${mod.noDelete?'':`<button class="btn sm danger" data-del="${it.id}">Eliminar</button>`}
      </div>
    </div>`;
  }).join('')}</div>` : `<div class="empty-state">Sin registros. ${mod.noCreate?'':'Presiona "+ Nuevo" para crear el primero.'}</div>`;

  const noteHTML = mod.note ? `<div class="badge warn" style="display:block;padding:8px 12px;margin-bottom:12px">${esc(mod.note)}</div>` : '';

  $app.innerHTML = `${topbarHTML(mod.label, mod.noCreate?'':`<button data-new>+ Nuevo</button>`)}
    <div class="mod-body">
      <div class="toolbar">
        <input type="search" placeholder="Buscar en ${esc(mod.label.toLowerCase())}…" value="${esc(params._q)}" data-search>
      </div>
      ${tabsHTML}
      ${noteHTML}
      ${listHTML}
    </div>`;
  wireTopbar();
  const nb = $app.querySelector('[data-new]'); if(nb) nb.addEventListener('click', ()=>openModForm(modKey,null,params));
  const sEl = $app.querySelector('[data-search]');
  sEl.addEventListener('input', ()=>{ params._q = sEl.value; renderModuleScreen(modKey, params); });
  sEl.focus(); sEl.selectionStart = sEl.selectionEnd = sEl.value.length;
  $app.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click', ()=>{ params._tab=b.dataset.tab; params._tabTouched=true; renderModuleScreen(modKey, params); }));
  $app.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click', ()=>openModForm(modKey,b.dataset.edit,params)));
  $app.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', ()=>{
    openConfirm('Eliminar registro','Esta acción no se puede deshacer en la demostración.','Eliminar','Cancelar', ()=>{
      DB[mod.coll] = DB[mod.coll].filter(x=>x.id!==b.dataset.del); saveDB(); renderModuleScreen(modKey, params); toast('Registro eliminado');
    });
  }));
  $app.querySelectorAll('[data-modact]').forEach(b=>b.addEventListener('click', (e)=>{
    const card = e.target.closest('[data-itemid]'); const it = DB[mod.coll].find(x=>x.id===card.dataset.itemid);
    mod.onAction(it, b.dataset.modact); saveDB(); renderModuleScreen(modKey, params); toast('Estado actualizado');
  }));
  $app.querySelectorAll('[data-qr]').forEach(b=>b.addEventListener('click', ()=>toast('Código QR generado (simulado) para el activo')));
  $app.querySelectorAll('[data-hoja]').forEach(b=>b.addEventListener('click', ()=>toast('Generando hoja de vida (PDF)… (simulado)')));

  if(params.autoNew && !params._autoNewDone){
    params._autoNewDone = true;
    openModForm(modKey, null, params);
  }
}

function openModForm(modKey, id, listParams){
  const mod = MODULES[modKey];
  const isEdit = !!id;
  let item = isEdit ? DB[mod.coll].find(x=>x.id===id) : {};
  if(isEdit && mod.onEditLoad){ mod.onEditLoad(item); }
  const fields = resolveFields(mod);
  overlayDirty = false;
  const lockedTipo = !isEdit && listParams && listParams.fixedTipo;
  openOverlay(`<div class="sheet" onmousedown="event.stopPropagation()">
    <div class="sheet-head"><h2>${isEdit?'Editar':'Nuevo'} — ${esc(mod.label)}</h2><button class="iconbtn" data-closeform>✕</button></div>
    <form id="modForm"><div class="sheet-body">
      ${fields.map(f=>{
        if(lockedTipo && f.key==='tipo'){ return `<input type="hidden" name="tipo" value="${esc(lockedTipo)}">`; }
        return fieldHTML(f, item[f.key]);
      }).join('')}
    </div>
    <div class="sheet-foot">
      <button type="button" class="btn" data-closeform>Cancelar</button>
      <button type="submit" class="btn primary">${isEdit?'Guardar cambios':'Guardar'}</button>
    </div></form>
  </div>`);
  const sheet = $ov.querySelector('.sheet');
  wireChips(sheet); wireSign(sheet);
  sheet.querySelectorAll('input,textarea,select').forEach(el=>el.addEventListener('input', ()=>overlayDirty=true));
  sheet.querySelectorAll('[data-closeform]').forEach(b=>b.addEventListener('click', ()=>askCloseOverlay()));
  document.getElementById('modForm').addEventListener('submit', e=>{
    e.preventDefault();
    const data = readForm(e.target, fields);
    if(lockedTipo) data.tipo = lockedTipo;
    if(isEdit){
      if(mod.onUpdate) mod.onUpdate(item, data);
      Object.assign(item, data);
      toast('Cambios guardados');
    } else {
      data.id = uid(modKey);
      data.companyId = session.companyId;
      if(mod.defaultStatus) data[mod.statusField] = mod.defaultStatus;
      if(mod.onCreate) mod.onCreate(data);
      DB[mod.coll].push(data);
      toast('Registro creado');
    }
    overlayDirty = false; saveDB(); closeOverlay();
    renderModuleScreen(modKey, listParams||{});
  });
}

}

/* ---------------- Estado de Mantenimiento / Estado de Rutinas ---------------- */
function addInterval(d, freq){
  const nd = new Date(d.getTime());
  if(freq==='Diaria') nd.setDate(nd.getDate()+1);
  else if(freq==='Semanal') nd.setDate(nd.getDate()+7);
  else if(freq==='Quincenal') nd.setDate(nd.getDate()+15);
  else if(freq==='Trimestral') nd.setMonth(nd.getMonth()+3);
  else if(freq==='Semestral') nd.setMonth(nd.getMonth()+6);
  else if(freq==='Anual') nd.setFullYear(nd.getFullYear()+1);
  else nd.setMonth(nd.getMonth()+1); /* Mensual por defecto */
  return nd;
}
function nextOccurrence(startISO, freq){
  let d = new Date(startISO+'T00:00:00'); const today = new Date(todayISO()+'T00:00:00'); let guard=0;
  while(d < today && guard<800){ d = addInterval(d, freq); guard++; }
  return d;
}
function renderEstadoCiclo(kind, bucketFilter){
  const isPlan = kind==='plan';
  const label = isPlan ? 'Estado de Mantenimiento' : 'Estado de Rutinas';
  const coll = isPlan ? companyColl('maintenancePlans') : companyColl('maintenanceRoutines');
  const today = new Date(todayISO()+'T00:00:00');
  const rows = coll.map(p=>{
    const start = isPlan ? p.fechaInicio : p.fechaInicioCiclo;
    const next = nextOccurrence(start||todayISO(), p.frecuencia);
    const diffDays = Math.round((next-today)/86400000);
    let bucket = 'Al día';
    if(diffDays<0) bucket='Atrasados'; else if(diffDays<=7) bucket='Próximos';
    const relatedOTs = companyColl('workOrders').filter(o=> (o.planOrigen||'')===p.nombre);
    return {p, next, diffDays, bucket, relatedOTs};
  });
  const buckets = ['Atrasados','Próximos','Al día'];
  const counts = { 'Atrasados':rows.filter(r=>r.bucket==='Atrasados').length, 'Próximos':rows.filter(r=>r.bucket==='Próximos').length, 'Al día':rows.filter(r=>r.bucket==='Al día').length, [isPlan?'Sin plan':'Sin rutina']: Math.max(0, coll.length - rows.length) };
  const shown = bucketFilter ? rows.filter(r=>r.bucket===bucketFilter) : rows;
  $app.innerHTML = `${topbarHTML(label)}
    <div class="mod-body">
      <div class="stat-row">
        ${Object.entries(counts).map(([l,c])=>`<div class="stat-box ${bucketFilter===l?'active':''}" data-bucket="${esc(l)}"><div class="n">${c}</div><div class="l">${esc(l)}</div></div>`).join('')}
      </div>
      <div class="card-list">${shown.length? shown.map(r=>`<div class="item-card">
          <div class="row1"><div><div class="ttl">${esc(r.p.nombre)}</div><div class="sub">${r.p.tipoMtto} · ${r.p.frecuencia} · ${esc(r.p.equipo||'')}</div></div>
            <span class="badge ${r.bucket==='Atrasados'?'bad':r.bucket==='Próximos'?'warn':'ok'}">${r.diffDays<0?('Atraso '+Math.abs(r.diffDays)+'d'):r.diffDays===0?'Vence hoy':('En '+r.diffDays+'d')}</span></div>
          <div class="sub">Próx.: ${fmtDate(r.next.toISOString().slice(0,10))} · ${r.relatedOTs.length} OT generada(s)${r.relatedOTs.some(o=>o.estado==='PENDIENTE')?'':''}</div>
          ${r.bucket!=='Al día' && !r.relatedOTs.some(o=>o.estado==='PENDIENTE') ? `<div class="acts"><button class="btn sm primary" data-genot="${r.p.id}">Generar OT</button></div>` : ''}
        </div>`).join('') : `<div class="empty-state">Sin registros en este filtro.</div>`}</div>
    </div>`;
  wireTopbar();
  $app.querySelectorAll('[data-bucket]').forEach(b=>b.addEventListener('click', ()=>renderEstadoCiclo(kind, b.dataset.bucket===bucketFilter?null:(buckets.includes(b.dataset.bucket)?b.dataset.bucket:null))));
  $app.querySelectorAll('[data-genot]').forEach(b=>b.addEventListener('click', ()=>{
    const p = coll.find(x=>x.id===b.dataset.genot);
    DB.workOrders.push({ id:uid('ot'), companyId:session.companyId, consecutivo:'OT-'+String(1000000+companyColl('workOrders').length+1),
      titulo:`${isPlan?'Plan':'Rutina'} ${p.nombre} — ${p.equipo||''}`, tipoMtto:p.tipoMtto, prioridad:p.prioridad||'Media', tipoActivo:p.tipoActivo||'equipo',
      assetIds:[], planOrigen:p.nombre, actividades:(p.actividades||[]).map(a=>({texto:a.texto,completada:false})),
      responsable:p.responsable||'Sin asignar', fechaProgramada:todayISO(), fechaLimite:null, turno:'Mañana', observacionesAdmin:'Generada automáticamente', estado:'PENDIENTE' });
    saveDB(); toast('OT generada'); renderEstadoCiclo(kind, bucketFilter);
  }));
}

  if(session.view==='indicadores'){ renderIndicadores(); return; }
